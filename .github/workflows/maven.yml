name: Java CI with Maven
on: 
  push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'adopt'
        cache: maven
    - name: Build with Maven
      run: |
        start_time=$(date +%s)
        mvn --batch-mode --update-snapshots verify | tee build_output.log
        end_time=$(date +%s)
        build_time=$((end_time - start_time))
        echo "BUILD_TIME_SECONDS=$build_time" >> build_output.log
    - name: Check the plugins in the zip
      run: bash use-assembly/check-plugins.sh use-assembly/target/use-*-use-bin.zip
    - name: Upload build result
      run: mkdir staging && cp use-assembly/target/*.zip staging
    - uses: actions/upload-artifact@v4
      with:
        name: Package
        path: staging
    - uses: actions/upload-artifact@v4
      with: 
        name: build-log
        path: build_output.log
    - uses: actions/upload-artifact@v4
      with:
        name: failure-reports
        path: |
          docs/archunit-results/cycles-current-failure-report.txt
          docs/archunit-results/layers-current-failure-report.txt

  # Keeps the zip of the last green build of develop at a stable public URL:
  # https://github.com/<repo>/releases/download/latest-develop/<zip name>
  publish-latest-develop:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: Package
        path: package
    - name: Publish to the latest-develop release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        notes="Built from ${GITHUB_SHA} on develop."
        if gh release view latest-develop >/dev/null 2>&1; then
          gh release edit latest-develop --notes "$notes"
        else
          gh release create latest-develop --prerelease --target "$GITHUB_SHA" --title "Latest develop build" --notes "$notes"
        fi
        gh release upload latest-develop package/*.zip --clobber
